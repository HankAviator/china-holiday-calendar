name: Update China Holiday Calendars

on:
  workflow_dispatch:
  schedule:
    - cron: '2 */3 * * *'

concurrency:
  group: update-calendars-${{ github.ref }}
  # A scheduled run must finish the guarded push/restore sequence once it starts.
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/hankaviator/china-holiday-calendar-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Generate calendars
        run: PYTHONPATH=src python -m china_holiday_calendar

      - name: Commit updated feeds
        run: |
          if [ -z "$(git status --porcelain calendars data)" ]; then
            echo "No generated feed changes detected."
            exit 0
          fi

          if git diff --quiet \
            --ignore-matching-lines='^DTSTAMP:' \
            --ignore-matching-lines='^  "generated_at": ' \
            -- calendars data; then
            echo "No new holiday information announced."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendars data
          git commit -m "Update China holiday calendars"
          git push

      - name: Record scheduled activity without changing repository state
        if: ${{ github.event_name == 'schedule' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail

          branch="${DEFAULT_BRANCH:?DEFAULT_BRANCH is required}"
          branch_ref="refs/heads/${branch}"
          tracking_ref="refs/remotes/origin/${branch}"

          git fetch --no-tags origin "+${branch_ref}:${tracking_ref}"
          original_sha="$(git rev-parse "${tracking_ref}")"
          current_sha="$(git rev-parse HEAD)"

          if [ "$current_sha" != "$original_sha" ]; then
            echo "::error::The remote ${branch} advanced during the calendar update; refusing to create an activity commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Reuse the original tree so the temporary commit cannot contain feed changes.
          tree_sha="$(git rev-parse "${original_sha}^{tree}")"
          temporary_sha="$(
            git commit-tree "$tree_sha" \
              -p "$original_sha" \
              -m "chore: keep scheduled workflow active (temporary)"
          )"

          activity_pushed=false
          restored=false
          restore() {
            if [ "$activity_pushed" != true ] || [ "$restored" = true ]; then
              return 0
            fi

            echo "Attempting a guarded restoration of ${branch} to ${original_sha}."
            if git push \
              --force-with-lease="${branch_ref}:${temporary_sha}" \
              origin \
              "${original_sha}:${branch_ref}"; then
              restored=true
            else
              echo "::error::Could not restore ${branch}. No unrelated newer SHA was reset; inspect for a concurrent update, branch protection, or insufficient contents:write permission."
            fi
          }
          trap restore EXIT

          echo "Pushing temporary activity commit ${temporary_sha} on ${branch}."
          activity_pushed=true
          if ! git push \
            --force-with-lease="${branch_ref}:${original_sha}" \
            origin \
            "${temporary_sha}:${branch_ref}"; then
            echo "::error::The temporary activity commit was not accepted by ${branch}; no restore was attempted against an unrelated SHA."
            exit 1
          fi

          remote_sha="$(git ls-remote --exit-code origin "$branch_ref" | awk 'NR == 1 { print $1 }')"
          if [ "$remote_sha" != "$temporary_sha" ]; then
            echo "::error::The remote ${branch} changed after the temporary push; refusing to reset it."
            exit 1
          fi

          if ! git push \
            --force-with-lease="${branch_ref}:${temporary_sha}" \
            origin \
            "${original_sha}:${branch_ref}"; then
            echo "::error::The guarded restoration was rejected; the remote branch was not reset to an unexpected commit."
            exit 1
          fi
          restored=true

          final_sha="$(git ls-remote --exit-code origin "$branch_ref" | awk 'NR == 1 { print $1 }')"
          if [ "$final_sha" != "$original_sha" ]; then
            echo "::error::The remote ${branch} no longer points to the original SHA ${original_sha}; refusing any further force-push."
            exit 1
          fi

          echo "Restored ${branch} to ${original_sha}; repository contents and branch history are unchanged."
