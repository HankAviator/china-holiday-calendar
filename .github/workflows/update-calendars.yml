name: Update China Holiday Calendars

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Generate calendars
        run: PYTHONPATH=src python -m china_holiday_calendar

      - name: Commit updated calendars
        run: |
          if [ -z "$(git status --porcelain calendars)" ]; then
            echo "No calendar changes detected."
            exit 0
          fi

          if git diff --quiet \
            --ignore-matching-lines='^DTSTAMP:' \
            --ignore-matching-lines='^  "generated_at": ' \
            -- calendars; then
            echo "No new holiday information announced."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendars
          git commit -m "Update China holiday calendars"
          git push
