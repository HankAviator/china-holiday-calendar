name: Update China Holiday Calendars

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: write
  packages: read

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hankaviator/china-holiday-calendar-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Generate calendars
        run: PYTHONPATH=src python -m china_holiday_calendar

      - name: Commit updated calendars
        run: |
          if [ -z "$(git status --porcelain calendars)" ]; then
            echo "No calendar changes detected."
            exit 0
          fi

          if git diff --quiet \
            --ignore-matching-lines='^DTSTAMP:' \
            --ignore-matching-lines='^  "generated_at": ' \
            -- calendars; then
            echo "No new holiday information announced."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendars
          git commit -m "Update China holiday calendars"
          git push
