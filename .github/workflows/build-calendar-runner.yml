name: Build Calendar Runner Image

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/docker/calendar-runner/Dockerfile'
      - '.github/workflows/build-calendar-runner.yml'
      - 'requirements.txt'

concurrency:
  group: build-calendar-runner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hankaviator/china-holiday-calendar-runner
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/calendar-runner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
